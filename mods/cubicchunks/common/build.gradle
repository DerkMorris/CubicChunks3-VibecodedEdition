plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'io.github.opencubicchunks.javaheaders' version '1.2.8'
}
javaHeaders {
    setAcceptedJars('.*CubicChunksCore.*')
    setConfig(parent.file('javaHeaders.json'))
}
configurations.configureEach {
    if (name.endsWith('DependencyResolve')) {
        attributes.attribute(Attribute.of('javaHeadersLinked', Boolean), false)
    }
}
loom { accessWidenerPath = file('src/main/resources/cubicchunks.accesswidener') }
repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly "net.fabricmc:fabric-loader:${loader_version}"
    implementation(project(':libraries:cubicchunks-core')) {
        attributes { attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements.class, LibraryElements.JAR)) }
        transitive = false
    }
    compileOnly 'io.github.notstirred:dasm:3.2.0:api'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.electronwill.night-config:core:3.9.0'
    implementation 'com.electronwill.night-config:toml:3.9.0'
}
compileJava.dependsOn ':libraries:cubicchunks-core:jar'
tasks.named('compileTestJava') { enabled = false }
tasks.named('test') { enabled = false }
apply from: rootProject.file('gradle/check-common.gradle')
