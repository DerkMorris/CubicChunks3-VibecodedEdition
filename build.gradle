plugins { id 'base' }
project(':libraries') { apply plugin: 'base' }

def mods = subprojects.findAll { it.parent == rootProject && it.file('mod.properties').isFile() }
configure(mods) { apply from: rootProject.file('gradle/family-mod.gradle') }

tasks.register('collectJars', Sync) {
    mods.each { mod ->
        dependsOn "${mod.path}:collectJars"
        from(mod.layout.buildDirectory.dir('libs')) { include '*.jar' }
    }
    into layout.buildDirectory.dir('libs')
}
tasks.named('assemble') { dependsOn 'collectJars' }
tasks.named('check') {
    dependsOn mods.collect { "${it.path}:check" }
    dependsOn ':libraries:cubicchunks-core:check'
}
tasks.named('clean') { dependsOn subprojects.collect { "${it.path}:clean" } }
tasks.register('listMods') {
    group = 'help'
    doLast {
        mods.each { mod ->
            logger.lifecycle("${mod.name} ${mod.version} — ${mod.subprojects.findAll { it.name != 'common' }.collect { it.name }.join(', ')}")
        }
    }
}
['genAll', 'spotlessApply', 'runClient', 'runServer'].each { taskName ->
    tasks.register(taskName) { dependsOn ":cubicchunks:fabric:${taskName}" }
}
if (project.hasProperty('worldSmoke')) {
    tasks.register('runWorldSmoke') { dependsOn ':cubicchunks:fabric:runWorldSmoke' }
}

tasks.register('jar') { dependsOn 'collectJars' }
