repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
}
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'
configurations {
    bundledDasm
    // Shaded into this adapter. Exporting the original JAR as well creates duplicate JPMS modules on Forge.
    compileOnly.extendsFrom bundledDasm
}
dependencies {
    bundledDasm('io.github.notstirred:dasm:3.2.0') { transitive = false }
    compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
    compileOnly 'org.ow2.asm:asm:9.9.1'
    compileOnly 'org.ow2.asm:asm-tree:9.9.1'
    compileOnly 'org.ow2.asm:asm-commons:9.9.1'
    compileOnly 'com.google.code.gson:gson:2.13.2'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.25.1'
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-proc:none'] }
jar {
    from({ configurations.bundledDasm.collect { zipTree(it) } }) { exclude 'META-INF/MANIFEST.MF' }
    from(parent.file('NOTICE.txt'))
    duplicatesStrategy = DuplicatesStrategy.FAIL
    manifest.attributes 'MixinConfigs': 'dasm-mod.mixins.json'
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/*.toml') { expand version: project.version }
}
